name: Build Astro v5 Windows

on:
  workflow_dispatch:
  push:
    branches: [astro-bot-jetsku-v5]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test Astro v5 (Windows)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Generate build metadata
        id: metadata
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "tag=KytyPS5-Astro-v5-$shortSha-Windows-x64" >> $env:GITHUB_OUTPUT

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" >> $env:GITHUB_OUTPUT
          "port_hash=$($portHash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" >> $env:GITHUB_PATH

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up LLVM 23.1.2
        shell: pwsh
        timeout-minutes: 20
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-23.1.2.tar.zst'
          Write-Host 'Downloading the pinned LLVM archive...'
          curl.exe --fail --location --retry 2 --connect-timeout 30 --max-time 600 --output $archive 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/clang%2Bllvm-23.1.2-x86_64-pc-windows-msvc.tar.zst'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Download complete; verifying SHA256...'
          $expected = 'ceaee048142fece144752c6f6431cb0905a7a6160f78ab8cf5cf0b6216f99418'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'LLVM archive checksum mismatch.'
          }
          New-Item -ItemType Directory -Path 'C:\LLVM-23.1.2' | Out-Null
          # windows-2022 provides zstd. A native pipeline preserves archive bytes on any pwsh version.
          Get-Command zstd.exe -ErrorAction Stop | Out-Null
          Write-Host 'Extracting LLVM from Zstandard...'
          # LLVM's official archive uses a 1 GiB Zstandard window.
          & cmd.exe /d /c "zstd.exe --decompress --long=30 --stdout ""$archive"" | tar.exe -xf - --strip-components=1 -C C:\LLVM-23.1.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & 'C:\LLVM-23.1.2\bin\clang-cl.exe' --version | Select-Object -First 1
          Write-Host $version
          if ($version -notmatch 'clang version 23\.1\.2\b') { throw "Unexpected compiler: $version" }
          foreach ($tool in 'lld-link.exe', 'llvm-lib.exe') {
            if (-not (Test-Path -LiteralPath "C:\LLVM-23.1.2\bin\$tool")) { throw "$tool missing" }
          }

      - name: Map source to the PGO training path
        shell: cmd
        run: |
          mklink /J C:\kyty-src "%GITHUB_WORKSPACE%"
          if errorlevel 1 exit /b 1
          git config --global --add safe.directory C:/kyty-src

      - name: Configure
        shell: cmd
        run: |
          set LLVM=C:/LLVM-23.1.2/bin
          cmake -S C:\kyty-src -B _Build/windows -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_CXX_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_LINKER=%LLVM%/lld-link.exe ^
            -DCMAKE_AR=%LLVM%/llvm-lib.exe ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%" ^
            -DKYTY_EMULATOR_IPO=ON ^
            -DKYTY_PGO_USE=C:/kyty-src/tools/pgo/u59-int9-sg-1.profdata ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=%GITHUB_REPOSITORY% ^
            -DKYTY_RELEASE_TAG=${{ steps.metadata.outputs.tag }} ^
            -DTRACY_NO_SYSTEM_TRACING=ON

      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --parallel 4 --target launcher kyty_emulator ^
            clear_register_decode_tests pad_haptics_tests controller_settings_tests shader_cfg_tests

      # Hosted runners have no Vulkan GPU. GPU suites and the game were tested locally.
      # thread_service has a known Windows deadline-precision failure; do not mask it as a pass.
      - name: Test without GPU
        shell: pwsh
        run: |
          ctest --test-dir _Build/windows --output-on-failure --timeout 120 -R '^(clear_register_decode|pad_haptics|controller_settings)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '_Build/windows/shader_cfg_tests.exe' --ray-tracing-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install portable runtime
        shell: cmd
        run: |
          cmake --install _Build/windows --prefix _Build/windows/install

      - name: Package and verify
        shell: pwsh
        run: |
          $runtime = Join-Path $env:GITHUB_WORKSPACE '_Build/windows/install'
          foreach ($name in 'kyty_emulator.exe', 'launcher.exe', 'Launch-AstroBot.ps1', 'Probar-AstroBot.cmd', 'u59-preset.json') {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $name))) { throw "Missing $name" }
          }
          foreach ($name in '_Patches', '_SaveData', '_PipelineCache', 'Kyty.ini') {
            if (Test-Path -LiteralPath (Join-Path $runtime $name)) { throw "Unexpected runtime data: $name" }
          }
          Copy-Item -LiteralPath 'README.md', 'LICENSE' -Destination $runtime
          $licenses = Join-Path $runtime 'licenses'
          New-Item -ItemType Directory -Path $licenses -Force | Out-Null
          Copy-Item -Path 'LICENSES/*' -Destination $licenses -Recurse -Force
          $fonts = Join-Path $runtime '3rdparty/tracy/profiler/src/font'
          New-Item -ItemType Directory -Path $fonts -Force | Out-Null
          Copy-Item -Path '3rdparty/tracy/profiler/src/font/Roboto-*.ttf' -Destination $fonts
          if (@(Get-ChildItem -LiteralPath $fonts -Filter 'Roboto-*.ttf').Count -ne 4) { throw 'Expected four Roboto fonts.' }
          Copy-Item -LiteralPath '3rdparty/SPIRV-Tools/LICENSE' -Destination (Join-Path $fonts 'LICENSE-Apache-2.0.txt')
          $manifest = @("Source: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA", 'LLVM: 23.1.2; Qt: 6.10.3; Release + IPO + Jetsku PGO')
          foreach ($name in 'kyty_emulator.exe', 'launcher.exe', 'Launch-AstroBot.ps1', 'Probar-AstroBot.cmd', 'u59-preset.json') {
            $hash = (Get-FileHash -LiteralPath (Join-Path $runtime $name) -Algorithm SHA256).Hash
            $manifest += "$hash  $name"
          }
          $manifest | Set-Content -LiteralPath (Join-Path $runtime 'BUILD-INFO.txt') -Encoding utf8

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.tag }}
          path: _Build/windows/install/**
          if-no-files-found: error
          retention-days: 30
